# Localhost-only dev: npm run dev:localhost
# Storefront / app proxy need a tunnel: npm run dev

client_id = "0afb53c6f497bbf31cf6bf018ac4c5cf"
name = "selfhosted"
application_url = "https://example.com"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = false

[webhooks]
api_version = "2026-07"

[access_scopes]
scopes = "write_app_proxy"

[app_proxy]
url = "/larapush"
prefix = "apps"
subpath = "larapush"

[auth]
redirect_urls = [
  "https://example.com/auth/callback",
  "https://example.com/auth/shopify/callback",
  "https://example.com/api/auth/callback",
]
